version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ecommerce_admin_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: ecommerce_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: ecommerce_admin_db
      APP_ENV: production
      WORKERS: 4
      SECRET_KEY: dev-secret-key-change-in-production-long-secure-key
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  mongodb_data:

networks:
  backend-net:
    driver: bridge
